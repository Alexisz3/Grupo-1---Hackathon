# Escuela Semilla con Docker. Guía completa: docs/docker.md
# Todo junto: ./scripts/escuela.sh up   (o: docker compose --profile voice --profile images up -d --build)
name: escuela-semilla

services:
  # La app: web + API + base SQLite (volumen data)
  app:
    build: .
    # Por defecto solo en esta máquina. En un servidor: APP_BIND=0.0.0.0 en .env (o usar el perfil tunnel)
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    env_file: [{path: .env, required: false}]
    # Dentro de Docker la voz y el ilustrador se llaman por nombre de servicio
    environment:
      TTS_URL: http://voice:8880/v1/audio/speech
      IMAGE_URL: http://painter:7860/generate
    volumes: [data:/app/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  # Voz local en español (Kokoro, CPU). Perfil voice. Imagen de ~5 GB
  voice:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: [voice]
    ports: ["127.0.0.1:8880:8880"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health')"]
      interval: 15s
      start_period: 120s
      retries: 10
    restart: unless-stopped

  # Ilustraciones locales (SD-Turbo, CPU). Perfil images. Baja el modelo (~2 GB) la primera vez al volumen models
  painter:
    build: ./painter
    profiles: [images]
    ports: ["127.0.0.1:7860:7860"]
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 15s
      start_period: 600s
      retries: 10
    restart: unless-stopped

  # Texto con IA local, sin clave (gemma3:4b, CPU). Perfil ollama. En .env:
  # MODEL_URL=http://ollama:11434/v1/chat/completions  MODEL_NAME=gemma3:4b  (MODEL_KEY y MODEL_EFFORT vacíos)
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_KEEP_ALIVE: 24h
    # Descarga el modelo la primera vez y lo deja cargado
    entrypoint: ["sh", "-c", "ollama serve & sleep 4; ollama pull $$OLLAMA_MODEL; wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 15s
      start_period: 900s
      retries: 10
    restart: unless-stopped

  # Enlace https público y temporal (el micrófono del navegador exige https). Perfil tunnel.
  # El enlace aparece en: docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on: [app]
    restart: unless-stopped

volumes:
  data:
  ollama:
  models:
