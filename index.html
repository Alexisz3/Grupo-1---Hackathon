<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escuela Semilla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="brand"><span aria-hidden="true">✿</span> Escuela Semilla</div></header>
  <main>
    <section id="zones">
      <div class="welcome">
        <div class="welcomeCopy">
          <h1>Hoy tú enseñas.</h1>
          <p>Elige una zona y juega con tu personaje.</p>
        </div>
        <img src="art/aula.webp" width="800" height="533" alt="">
      </div>
      <div class="zoneTitle">
        <h2>Elige tu zona</h2>
        <p id="reward" class="reward">⭐ 0 de 3 estrellas</p>
      </div>
      <div class="zoneGrid">
        <button data-zone="math" aria-labelledby="mathLabel"><img class="scene" src="art/contar.webp" alt=""><strong id="mathLabel">Matemáticas</strong><span>Junta semillas <span aria-hidden="true">→</span></span></button>
        <button data-zone="story" aria-labelledby="storyLabel"><img class="scene" src="art/relato.webp" alt=""><strong id="storyLabel">Lenguaje</strong><span>Cuenta un cuento <span aria-hidden="true">→</span></span></button>
        <button data-zone="history" aria-labelledby="historyLabel"><img class="scene" src="art/recuerdos.webp" alt=""><strong id="historyLabel">Historia</strong><span>Viaja al pasado <span aria-hidden="true">→</span></span></button>
      </div>
    </section>

    <nav id="activityNav" hidden aria-label="Actividad">
      <button id="back">← Zonas</button>
      <button id="edit">Mi personaje</button>
    </nav>

    <section id="setup" hidden>
      <h2>Mi personaje</h2>
      <div id="avatars" role="group" aria-label="Personajes"></div>
      <label>Nombre <input id="name" value="Pipo" maxlength="24"></label>
      <details id="drawing">
        <summary>✏️ Dibujar mi personaje</summary>
        <label>Mi compañero es un
          <select id="species"><option value="cat">gato</option><option value="rabbit">conejo</option><option value="bird">pájaro</option></select>
        </label>
        <canvas width="280" height="150" aria-label="Superficie de dibujo"></canvas>
        <button id="erase">Borrar</button>
        <button id="generate" disabled>Crear con IA</button>
        <p id="artStatus" role="status"></p>
        <img id="artPreview" hidden width="144" height="144" alt="Tu dibujo completado por la IA">
      </details>
      <button class="primary" id="start">¡A jugar!</button>
    </section>

    <section id="lesson" hidden aria-labelledby="prompt">
      <div class="lessonTop">
        <div class="lessonLabels"><p id="stage"></p><p id="phase"></p></div>
        <button id="listen" hidden>🔊 Escuchar</button>
      </div>
      <div class="buddy">
        <span id="face"></span>
        <div><strong id="buddyName"></strong><h1 id="prompt" tabindex="-1"></h1></div>
      </div>
      <div id="board"></div>
      <p id="feedback" role="status"></p>
      <div id="choices"></div>
      <button id="hint" hidden>💡 Dame una pista</button>
      <button id="next" class="primary" hidden></button>
      <details id="explain" hidden>
        <summary>Contárselo con mis palabras</summary>
        <form id="tell">
          <label for="answer">¿Cómo lo hiciste?</label>
          <textarea id="answer" rows="2" maxlength="1000"></textarea>
          <button type="button" id="speak" hidden>🎙️ Dictar</button>
          <button id="send" type="submit">Contar</button>
        </form>
        <p id="reply" role="status"></p>
      </details>
    </section>

    <section id="done" hidden>
      <div class="bigStar" aria-hidden="true">⭐</div>
      <h2 id="finishTitle" tabindex="-1">¡Gracias, profe!</h2>
      <p id="result"></p>
      <p id="challengeResult"></p>
      <button id="again" class="primary">Elegir otra zona</button>
    </section>
  </main>
  <script src="logic.js"></script>
  <script src="app.js"></script>
  <script src="character.js"></script>
</body>
</html>
